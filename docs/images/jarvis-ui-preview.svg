<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Illustrative JARVIS 22 interface preview</title><desc id="desc">An illustrative desktop window with navigation, AI assistant setup, chat bubbles and a message input.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d18"/><stop offset="1" stop-color="#142744"/></linearGradient></defs>
<rect width="1200" height="700" rx="20" fill="#070b12"/><rect x="18" y="18" width="1164" height="664" rx="14" fill="url(#bg)" stroke="#2a3d57"/>
<rect x="18" y="18" width="1164" height="70" rx="14" fill="#101a2b"/><rect x="18" y="74" width="1164" height="14" fill="#101a2b"/><circle cx="48" cy="52" r="7" fill="#ff6f70"/><circle cx="72" cy="52" r="7" fill="#f3c45f"/><circle cx="96" cy="52" r="7" fill="#62d58a"/><text x="132" y="59" font-family="Segoe UI,Arial" font-size="22" font-weight="700" fill="#eff7ff">JARVIS 22</text><text x="1030" y="58" font-family="Segoe UI,Arial" font-size="14" fill="#8ee9b4">● Desktop interface</text>
<rect x="40" y="110" width="250" height="540" rx="15" fill="#101a2b" stroke="#24364f"/><text x="65" y="151" font-family="Segoe UI,Arial" font-size="19" font-weight="700" fill="#edf6ff">Workspace</text>
<rect x="55" y="173" width="220" height="50" rx="9" fill="#0b648b" stroke="#159bd0"/><text x="76" y="204" font-family="Segoe UI,Arial" font-size="17" fill="#fff">AI Assistant</text>
<rect x="55" y="236" width="220" height="50" rx="9" fill="#182842" stroke="#304765"/><text x="76" y="267" font-family="Segoe UI,Arial" font-size="16" fill="#d8e7f8">AI Provider Setup</text>
<rect x="55" y="299" width="220" height="50" rx="9" fill="#182842" stroke="#304765"/><text x="76" y="330" font-family="Segoe UI,Arial" font-size="16" fill="#d8e7f8">Desktop Actions</text>
<rect x="55" y="362" width="220" height="50" rx="9" fill="#182842" stroke="#304765"/><text x="76" y="393" font-family="Segoe UI,Arial" font-size="16" fill="#d8e7f8">About &amp; Status</text>
<text x="62" y="606" font-family="Segoe UI,Arial" font-size="13" fill="#91a8c5">Starter build · Internet needed</text>
<rect x="310" y="110" width="850" height="540" rx="15" fill="#101a2b" stroke="#24364f"/><text x="340" y="151" font-family="Segoe UI,Arial" font-size="24" font-weight="700" fill="#eff7ff">AI Assistant</text><text x="340" y="181" font-family="Segoe UI,Arial" font-size="15" fill="#9aabc3">Configure a compatible chat endpoint to start a text conversation.</text>
<rect x="340" y="200" width="790" height="62" rx="10" fill="#2a2416" stroke="#725b2b"/><text x="358" y="225" font-family="Segoe UI,Arial" font-size="14" fill="#f6d99a">API key stays in page memory only.</text><text x="358" y="245" font-family="Segoe UI,Arial" font-size="13" fill="#d9c38f">Voice, phone control and background automation are not included in this starter.</text>
<text x="340" y="292" font-family="Segoe UI,Arial" font-size="14" fill="#b6c7dd">API ENDPOINT</text><rect x="340" y="303" width="790" height="42" rx="8" fill="#080f1d" stroke="#30415a"/><text x="356" y="330" font-family="Consolas,monospace" font-size="14" fill="#b8d5ef">https://api.openai.com/v1/chat/completions</text>
<text x="340" y="372" font-family="Segoe UI,Arial" font-size="14" fill="#b6c7dd">MODEL NAME</text><rect x="340" y="383" width="380" height="42" rx="8" fill="#080f1d" stroke="#30415a"/><text x="356" y="410" font-family="Segoe UI,Arial" font-size="14" fill="#7389a4">Enter a model name</text>
<text x="740" y="372" font-family="Segoe UI,Arial" font-size="14" fill="#b6c7dd">API KEY</text><rect x="740" y="383" width="390" height="42" rx="8" fill="#080f1d" stroke="#30415a"/><text x="756" y="410" font-family="Segoe UI,Arial" font-size="14" fill="#7389a4">Paste provider API key</text>
<rect x="340" y="442" width="790" height="110" rx="10" fill="#080f1d" stroke="#24364f"/><rect x="358" y="458" width="460" height="38" rx="8" fill="#14233a"/><text x="374" y="482" font-family="Segoe UI,Arial" font-size="14" fill="#c7ddf4">JARVIS: Ready. Configure your provider, then send a message.</text><text x="358" y="527" font-family="Segoe UI,Arial" font-size="13" fill="#8198b5">Conversation replies appear here.</text>
<rect x="340" y="570" width="650" height="55" rx="9" fill="#080f1d" stroke="#30415a"/><text x="358" y="603" font-family="Segoe UI,Arial" font-size="15" fill="#7389a4">Type a message...</text><rect x="1004" y="570" width="126" height="55" rx="9" fill="#0b648b" stroke="#159bd0"/><text x="1027" y="603" font-family="Segoe UI,Arial" font-size="15" font-weight="700" fill="#fff">Send message</text>
</svg>