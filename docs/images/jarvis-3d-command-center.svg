 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a3f4ff"/><stop offset=".45" stop-color="#35d8ff"/><stop offset="1" stop-color="#3c79ff"/></linearGradient>
 <radialGradient id="orb"><stop stop-color="#d7ffff"/><stop offset=".15" stop-color="#57e8ff"/><stop offset=".45" stop-color="#147bc5" stop-opacity=".75"/><stop offset="1" stop-color="#113cff" stop-opacity="0"/></radialGradient>
