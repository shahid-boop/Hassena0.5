<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">JARVIS 22 3D-style command center concept</title><desc id="desc">A perspective-style futuristic desktop assistant interface with a central glowing AI orb, chat panel, system panels, and a holographic grid. Concept illustration, not a live application screenshot.</desc>
