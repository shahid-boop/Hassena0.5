<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d">
<title id="t">Android device controls</title><desc id="d">A dark control panel with glowing tiles for flashlight, volume, brightness, apps, battery telemetry and a master dial.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d18"/><stop offset="1" stop-color="#142744"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#37c7ff" stop-opacity=".20"/><stop offset="1" stop-color="#37c7ff" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="700" rx="20" fill="url(#bg)"/>
<text x="52" y="74" fill="#eff7ff" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="800">Android Device Control</text>
<text x="52" y="112" fill="#8fb6d9" font-family="Segoe UI,Arial,sans-serif" font-size="20">Flashlight, volume, brightness, apps, telemetry &#8212; privileged actions wait for your confirmation</text>
<circle cx="980" cy="400" r="240" fill="url(#halo)"/>
<g font-family="Segoe UI,Arial,sans-serif">
<g transform="translate(60,170)"><rect width="340" height="150" rx="18" fill="#0e1c31" stroke="#2f5f86" stroke-width="2"/><path d="M52 56l24-20 24 20-10 12-14-10-14 10z" fill="#ffd76e"/><rect x="44" y="72" width="64" height="34" rx="8" fill="#1c3a58"/><text x="140" y="72" fill="#eaf6ff" font-size="21" font-weight="700">Flashlight</text><text x="140" y="102" fill="#7f9cbd" font-size="16">set_flashlight</text><rect x="248" y="56" width="56" height="30" rx="15" fill="#0f3b5c" stroke="#49caff"/><circle cx="289" cy="71" r="11" fill="#7fd4ff"/></g>
<g transform="translate(430,170)"><rect width="340" height="150" rx="18" fill="#0e1c31" stroke="#2f5f86" stroke-width="2"/><rect x="44" y="60" width="70" height="10" rx="5" fill="#1c3a58"/><rect x="44" y="60" width="46" height="10" rx="5" fill="#49caff"/><rect x="44" y="84" width="70" height="10" rx="5" fill="#1c3a58"/><rect x="44" y="84" width="60" height="10" rx="5" fill="#49caff"/><text x="140" y="72" fill="#eaf6ff" font-size="21" font-weight="700">Volume</text><text x="140" y="102" fill="#7f9cbd" font-size="16">set_volume &#183; streams</text></g>
<g transform="translate(800,170)"><rect width="340" height="150" rx="18" fill="#0e1c31" stroke="#2f5f86" stroke-width="2"/><circle cx="78" cy="78" r="26" fill="none" stroke="#ffd76e" stroke-width="4"/><g stroke="#ffd76e" stroke-width="4" stroke-linecap="round"><path d="M78 38v12M78 106v12M38 78h12M106 78h12M50 50l8 8M98 98l8 8M106 50l-8 8M58 98l-8 8"/></g><text x="140" y="72" fill="#eaf6ff" font-size="21" font-weight="700">Brightness</text><text x="140" y="102" fill="#7f9cbd" font-size="16">set_brightness</text></g>
<g transform="translate(60,350)"><rect width="340" height="150" rx="18" fill="#0e1c31" stroke="#2f5f86" stroke-width="2"/><g fill="#7fd4ff"><rect x="46" y="56" width="24" height="24" rx="6"/><rect x="80" y="56" width="24" height="24" rx="6" fill-opacity=".6"/><rect x="46" y="90" width="24" height="24" rx="6" fill-opacity=".6"/><rect x="80" y="90" width="24" height="24" rx="6" fill-opacity=".35"/></g><text x="140" y="72" fill="#eaf6ff" font-size="21" font-weight="700">Launch apps</text><text x="140" y="102" fill="#7f9cbd" font-size="16">launch_app &#183; open_url</text></g>
<g transform="translate(430,350)"><rect width="340" height="150" rx="18" fill="#0e1c31" stroke="#2f5f86" stroke-width="2"/><rect x="44" y="64" width="76" height="14" rx="7" fill="#1c3a58"/><rect x="44" y="64" width="58" height="14" rx="7" fill="#62d58a"/><text x="140" y="72" fill="#eaf6ff" font-size="21" font-weight="700">Telemetry</text><text x="140" y="102" fill="#7f9cbd" font-size="16">battery &#183; storage &#183; network</text></g>
<g transform="translate(800,350)"><rect width="340" height="150" rx="18" fill="#0e1c31" stroke="#2f5f86" stroke-width="2"/><rect x="44" y="54" width="70" height="48" rx="10" fill="none" stroke="#7fd4ff" stroke-width="3"/><path d="M56 70h34M56 82h24" stroke="#7fd4ff" stroke-width="3"/><path d="M96 96l16 16" stroke="#7fd4ff" stroke-width="4" stroke-linecap="round"/><text x="140" y="72" fill="#eaf6ff" font-size="21" font-weight="700">Accessibility</text><text x="140" y="102" fill="#7f9cbd" font-size="16">read &#183; click &#183; input</text></g>
<g transform="translate(60,530)"><rect width="710" height="120" rx="18" fill="#0e1c31" stroke="#2f5f86" stroke-width="2"/><path d="M50 60h36M68 42v36" stroke="#7fd4ff" stroke-width="4" stroke-linecap="round"/><text x="110" y="56" fill="#eaf6ff" font-size="20" font-weight="700">Calls, SMS &amp; form submits</text><text x="110" y="86" fill="#7f9cbd" font-size="16">explicit confirmation gate before anything is sent</text><rect x="560" y="40" width="120" height="40" rx="20" fill="#0f3b5c" stroke="#49caff"/><text x="584" y="66" fill="#7fd4ff" font-size="16" font-weight="700">APPROVE?</text></g>
<g transform="translate(800,530)"><circle cx="80" cy="60" r="56" fill="#0e1c31" stroke="#49caff" stroke-width="3"/><circle cx="80" cy="60" r="38" fill="none" stroke="#1c3a58" stroke-width="8"/><path d="M80 22a38 38 0 0 1 34 56" fill="none" stroke="#62d58a" stroke-width="8" stroke-linecap="round"/><circle cx="80" cy="60" r="8" fill="#7fd4ff"/><text x="160" y="56" fill="#eaf6ff" font-size="19" font-weight="700">Live status</text><text x="160" y="84" fill="#7f9cbd" font-size="15">every action logged</text></g>
</g>
</svg>
